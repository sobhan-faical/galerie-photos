<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie de photos interactive et accessible</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: Arial, Helvetica, sans-serif; background: #f3f6fb; color: #172334; text-align: center; }
    main { max-width: 1100px; margin: auto; }
    h1 { margin: 12px 0; }
    h2 { font-size: 1.2rem; font-weight: normal; margin-bottom: 24px; }
    #image { min-height: 310px; padding: 20px; margin: 0 auto 24px; max-width: 780px; border: 3px solid #1d4f91; border-radius: 14px; background-color: #dfeaf7; background-position: center; background-size: cover; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; }
    .galerie { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
    .preview { width: 220px; height: 145px; object-fit: cover; border: 3px solid #3e546c; border-radius: 10px; cursor: pointer; transition: transform .15s ease, border-color .15s ease; }
    .preview:hover { transform: scale(1.03); border-color: #005fcc; }
    .preview:focus-visible { outline: 4px solid #e8a100; outline-offset: 4px; border-color: #005fcc; }
    footer { margin-top: 28px; color: #36495c; }
    @media (max-width: 600px) { #image { min-height: 240px; } .preview { width: 42vw; height: 120px; } }
  </style>
  <script>
    function upDate(previewPic) {
      console.log('Image sélectionnée : ' + previewPic.alt);
      const zone = document.getElementById('image');
      zone.style.backgroundImage = 'url("' + previewPic.src + '")';
      zone.textContent = previewPic.alt;
      zone.style.color = '#ffffff';
      zone.style.textShadow = '0 2px 5px #000000';
    }

    function unDo() {
      console.log('Retour à la galerie initiale');
      const zone = document.getElementById('image');
      zone.style.backgroundImage = 'none';
      zone.textContent = 'Survolez une photo ou sélectionnez-la avec la touche Tab';
      zone.style.color = '#172334';
      zone.style.textShadow = 'none';
    }

    function addTabFocus() {
      console.log('onload : initialisation de la galerie');
      const images = document.querySelectorAll('.preview');
      for (let i = 0; i < images.length; i++) {
        images[i].setAttribute('tabindex', '0');
      }
      console.log(images.length + ' images accessibles au clavier');
    }
  </script>
</head>
<body onload="addTabFocus()">
  <main>
    <h1>Ma galerie de photos interactive</h1>
    <h2>Six magnifiques paysages à découvrir</h2>
    <div id="image" role="status" aria-live="polite">Survolez une photo ou sélectionnez-la avec la touche Tab</div>
    <div class="galerie" aria-label="Photos de paysages">
      <img class="preview" src="https://picsum.photos/id/1018/440/290" alt="Montagnes au bord d'un lac" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" src="https://picsum.photos/id/1015/440/290" alt="Rivière traversant des montagnes" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" src="https://picsum.photos/id/1016/440/290" alt="Paysage de montagne sous le ciel" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" src="https://picsum.photos/id/1020/440/290" alt="Paysage naturel verdoyant" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" src="https://picsum.photos/id/1036/440/290" alt="Vue panoramique sur la nature" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" src="https://picsum.photos/id/1043/440/290" alt="Montagnes et ciel lumineux" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>
    <footer><p>Utilisez la souris ou la touche Tab pour explorer les images.</p></footer>
  </main>
</body>
</html>
